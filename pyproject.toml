[project]
name = "geo-auditor"
version = "0.1.0"
description = "Generative Engine Optimization (GEO) Auditor — see how visible your business is in AI search."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
geo-auditor = "geo_auditor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
